<!DOCTYPE html>
<html lang="hu" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himzes Wiki</title> <!-- old: Patch Library -->
  <meta name="robots" content="noindex">
  <meta name="description" content="Internal collection of embroidery patch designs and techniques">
  <link rel="stylesheet" href="/HimzesWiki/styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/HimzesWiki/content/icons/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/HimzesWiki/content/icons/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/HimzesWiki/content/icons/favicon/favicon-16x16.png">
  <link rel="manifest" href="/HimzesWiki/content/icons/favicon/site.webmanifest">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; margin: 0;">
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <img src="/HimzesWiki/icon.png" alt="Himzes Wiki Logo" class="logo-image">
        <span class="logo-text unselectable">Hímzés Wiki</span>
      </div>
    </div>
  </header>

  <main class="main" style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;">
    <section class="empty-state" style="padding-top: 5rem; padding-bottom: 20rem;">
      <h1 style="font-size: 7.5rem; line-height: 1; margin-bottom: 0.75rem;">404</h1>
      <p style="font-size: 1rem; margin-bottom: 1.5rem;">
        Hoppá, ez az oldal nem létezik
      </p>
      <a href="./" class="patch-link-btn">Vissza a főoldalra</a>
    </section>
  </main>

  <p style="text-align: center; font-size: 0.75rem; color: var(--muted-foreground); margin: 0 0 0.75rem 0;">
    Az egész weblap egy oldal, mire számítottál?
  </p>
</body>
</html>
